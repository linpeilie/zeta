name: 功能建议 / Feature request
description: 提出新能力或改进 / Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先看一眼 [README 的「能做什么」](https://github.com/linpeilie/zeta/blob/dev/README.md#能做什么)
        和[产品需求文档](https://github.com/linpeilie/zeta/blob/dev/docs/zh/product/product_requirements.md)。
        Zeta 连接本机 AI 编码助手，提供对话、操作记录和文件浏览，不包含模型或代码编辑器。

        ---

        Before filing, please skim
        [what Zeta can do](https://github.com/linpeilie/zeta/blob/dev/README.en.md#what-you-can-do)
        and the [product requirements](https://github.com/linpeilie/zeta/blob/dev/docs/en/product/product_requirements.md).
        Zeta connects local AI coding assistants for conversations, operation records and file browsing. It does not include a model or code editor.

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查 / Preflight
      options:
        - label: 我已搜索过现有 Issue，没有找到重复。/ I searched existing issues and found no duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题 / What problem does this solve
      description: 请描述你遇到的实际场景，而不是直接描述方案。/ Describe the real situation you hit, not just the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案 / Proposed approach
      description: 期望在界面上或行为上表现成什么样。/ What it should look like or do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: 目前你是怎么绕过去的？/ How do you work around it today?

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope
      options:
        - 只影响我自己的用法 / Only affects my own workflow
        - 对多数用户应该都有用 / Likely useful to most users
        - 涉及新 Provider 接入 / Involves onboarding a new provider
        - 不确定 / Not sure
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿 / Willingness to contribute
      options:
        - label: 我愿意尝试提交 PR 实现它。/ I'd be willing to attempt a PR for this.
