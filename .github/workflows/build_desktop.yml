name: Build Desktop Packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  windows:
    name: Build Windows x64
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Package Windows release
        shell: pwsh
        run: ./tool/packaging/package_windows.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: zeta-windows-x64
          path: dist/zeta-*-windows-x64*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: Build macOS universal
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS release
        run: bash ./tool/packaging/package_macos.sh

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: zeta-macos-universal
          path: dist/zeta-*-macos-universal*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux:
    name: Build Linux x64
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          clang
          cmake
          ninja-build
          pkg-config
          libgtk-3-dev
          liblzma-dev
          libfontconfig1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux release
        run: bash ./tool/packaging/package_linux.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: zeta-linux-x64
          path: |
            dist/zeta-*-linux-x64*
            dist/zeta_*_amd64.deb*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
