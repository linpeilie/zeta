name: desktop-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.entrypoint }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - macos
          - windows
        entrypoint:
          - development
          - staging
          - production
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: >-
          sudo apt-get update -y &&
          sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: >-
          flutter build linux --release
          --target lib/main_${{ matrix.entrypoint }}.dart

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: >-
          flutter build macos --release
          --flavor ${{ matrix.entrypoint }}
          --target lib/main_${{ matrix.entrypoint }}.dart

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: >-
          flutter build windows --release
          --target lib/main_${{ matrix.entrypoint }}.dart
