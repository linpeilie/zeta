name: Release Desktop Packages
run-name: Release ${{ github.ref_name }}

on:
  push:
    # Tag 没有所属分支；prepare 会校验其提交必须位于 main 历史中。
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor \
            "${tag_commit}" \
            refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} is not reachable from main." >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate tag and application version
        id: metadata
        shell: bash
        run: >-
          dart tool/packaging/release_metadata.dart
          --tag "${GITHUB_REF_NAME}"
          --pubspec pubspec.yaml
          --github-output "${GITHUB_OUTPUT}"

  quality:
    name: CI quality gate
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  windows:
    name: Build Windows x86_64
    needs: [prepare, quality]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Package Windows release
        shell: pwsh
        run: >-
          ./tool/packaging/package_windows.ps1
          -ReleaseVersion '${{ needs.prepare.outputs.release_version }}'

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeta-windows-x86_64
          path: dist/zeta-*-windows-x86_64*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: Build macOS arm64, x86_64, and universal
    needs: [prepare, quality]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build universal macOS release
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-macos-arm64-only
          flutter build macos --release

      - name: Package macOS releases
        shell: bash
        run: >-
          bash ./tool/packaging/package_macos.sh
          '${{ needs.prepare.outputs.release_version }}'

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeta-macos
          path: dist/zeta-*-macos-*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux:
    name: Build Linux x86_64
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Linux build and packaging dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          appstream
          clang
          cmake
          curl
          desktop-file-utils
          file
          libfontconfig1-dev
          libfuse2t64
          libgirepository1.0-dev
          libgtk-3-dev
          liblzma-dev
          librsvg2-dev
          jq
          ninja-build
          patchelf
          pkg-config
          rpm

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux releases
        shell: bash
        run: >-
          bash ./tool/packaging/package_linux.sh
          '${{ needs.prepare.outputs.release_version }}'

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeta-linux-x86_64
          path: dist/zeta-*-linux-x86_64*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish immutable GitHub Release
    needs:
      - prepare
      - quality
      - windows
      - macos
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Check out publishing script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zeta-*
          path: dist
          merge-multiple: true

      - name: Validate assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash ./tool/packaging/publish_github_release.sh
          '${{ github.ref_name }}'
          '${{ needs.prepare.outputs.release_version }}'
          '${{ needs.prepare.outputs.prerelease }}'
          dist
