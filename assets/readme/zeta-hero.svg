<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Zeta — Local agent workbench</title>
  <desc id="desc">A dark technical hero showing Zeta as a Flutter desktop workspace with Projects, Agent, and Files panes connected by a Z-shaped execution path.</desc>

  <defs>
    <linearGradient id="hero-blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <clipPath id="workbench-clip">
      <rect x="676" y="58" width="460" height="284" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#0A0A0B"/>
  <path d="M0 328H1200" stroke="#27272A" stroke-width="1"/>
  <path d="M0 72H1200" stroke="#18181B" stroke-width="1"/>

  <g transform="translate(64 58)">
    <g aria-label="Zeta mark">
      <rect width="40" height="40" rx="10" fill="#2563EB"/>
      <path d="M10 12H30L10 28H30" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    </g>
    <text x="56" y="16" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.8">FLUTTER DESKTOP · LOCAL AGENT IDE</text>
    <text x="0" y="132" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="78" font-weight="700" letter-spacing="-2.5">Zeta</text>
    <text x="2" y="178" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26">A local workspace for coding agents,</text>
    <text x="2" y="212" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26">project context, and auditable timelines.</text>

    <g transform="translate(0 254)">
      <rect width="192" height="42" rx="12" fill="#18181B" stroke="#3F3F46"/>
      <circle cx="22" cy="21" r="6" fill="#60A5FA"/>
      <text x="40" y="27" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="600">Codex app-server</text>
      <rect x="214" width="126" height="42" rx="12" fill="#18181B" stroke="#3F3F46"/>
      <circle cx="236" cy="21" r="6" fill="#A78BFA"/>
      <text x="254" y="27" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="600">Grok ACP</text>
    </g>
  </g>

  <g clip-path="url(#workbench-clip)">
    <rect x="676" y="58" width="460" height="284" rx="20" fill="#111216" stroke="#3F3F46"/>
    <rect x="676" y="58" width="460" height="42" fill="#18191B"/>
    <circle cx="702" cy="79" r="5" fill="#71717A"/>
    <circle cx="720" cy="79" r="5" fill="#71717A"/>
    <circle cx="738" cy="79" r="5" fill="#71717A"/>
    <text x="1098" y="85" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="end">WORKBENCH</text>

    <g transform="translate(692 118)">
      <rect width="128" height="198" rx="10" fill="#18191B" stroke="#3F3F46"/>
      <text x="16" y="28" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">PROJECTS</text>
      <path d="M18 57H34M18 82H52M18 107H44M18 132H59" stroke="#71717A" stroke-linecap="round" stroke-width="6"/>
      <circle cx="18" cy="57" r="4" fill="#3B82F6"/>
      <circle cx="18" cy="82" r="4" fill="#52525B"/>
      <circle cx="18" cy="107" r="4" fill="#52525B"/>
      <circle cx="18" cy="132" r="4" fill="#52525B"/>
    </g>

    <g transform="translate(836 118)">
      <rect width="148" height="198" rx="10" fill="#18191B" stroke="#3F3F46"/>
      <text x="16" y="28" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">AGENT</text>
      <rect x="16" y="50" width="86" height="20" rx="7" fill="#27272A"/>
      <rect x="38" y="82" width="94" height="28" rx="9" fill="#1D4ED8"/>
      <rect x="16" y="122" width="112" height="20" rx="7" fill="#27272A"/>
      <rect x="16" y="154" width="70" height="20" rx="7" fill="#27272A"/>
      <circle cx="119" cy="96" r="5" fill="#BFDBFE"/>
    </g>

    <g transform="translate(1000 118)">
      <rect width="120" height="198" rx="10" fill="#18191B" stroke="#3F3F46"/>
      <text x="16" y="28" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">FILES</text>
      <path d="M18 58H48M18 84H82M18 110H64M18 136H91" stroke="#71717A" stroke-linecap="round" stroke-width="6"/>
      <path d="M18 58V136" stroke="#3F3F46" stroke-width="2"/>
      <circle cx="18" cy="58" r="4" fill="#3B82F6"/>
      <circle cx="18" cy="84" r="4" fill="#52525B"/>
      <circle cx="18" cy="110" r="4" fill="#52525B"/>
      <circle cx="18" cy="136" r="4" fill="#52525B"/>
    </g>

    <path d="M704 150H1104L704 278H1104" fill="none" opacity="0.88" stroke="url(#hero-blue)" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"/>
  </g>

  <g transform="translate(676 360)">
    <circle cx="7" cy="0" r="5" fill="#60A5FA"/>
    <text x="22" y="6" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">macOS · Windows · Linux</text>
  </g>
</svg>
