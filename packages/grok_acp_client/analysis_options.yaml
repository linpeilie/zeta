analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # This package intentionally performs asynchronous filesystem discovery so
    # provider/history operations never block Flutter's UI isolate.
    avoid_slow_async_io: false
    # Only the three symbols exported by the package barrel are public API.
    # The migrated ACP codec/reducer implementation remains package-internal.
    public_member_api_docs: false
