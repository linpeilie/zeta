name: zeta
description: AI Agent Code Editor
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

workspace:
  - packages/*
  - packages/app_ui/widgetbook

dependencies:
  agent_config_client:
    path: packages/agent_config_client
  agent_conversation_repository:
    path: packages/agent_conversation_repository
  agent_history_client:
    path: packages/agent_history_client
  agent_management_client:
    path: packages/agent_management_client
  agent_management_repository:
    path: packages/agent_management_repository
  agent_provider_contracts:
    path: packages/agent_provider_contracts
  agent_provider_repository:
    path: packages/agent_provider_repository
  app_ui:
    path: packages/app_ui
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  claude_code_client:
    path: packages/claude_code_client
  codex_app_server_client:
    path: packages/codex_app_server_client
  desktop_notifications_repository:
    path: packages/desktop_notifications_repository
  desktop_platform_api:
    path: packages/desktop_platform_api
  desktop_platform_repository:
    path: packages/desktop_platform_repository
  file_selector: ^1.1.0
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_highlight: ^0.7.0
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  grok_acp_client:
    path: packages/grok_acp_client
