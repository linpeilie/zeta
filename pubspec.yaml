name: zeta
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# Pub workspace：根 Flutter 应用 + 内部 Package 共用一份依赖解析与 lock。
# 目标 Package 图与依赖方向见 AGENTS.md §1 G6。
workspace:
  - packages/zeta_agent_core
  - packages/zeta_agent_provider_api
  - packages/zeta_agent_provider_sdk
  - packages/zeta_agent_providers
  - packages/zeta_foundation
  - packages/zeta_markdown
  - packages/zeta_plugin_kernel
  - packages/zeta_ui

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  glob: ^2.1.2
  highlight: ^0.7.0
  intl: any
  logger: ^2.7.0
  macos_window_utils: ^1.9.1
  meta: ^1.16.0
  pasteboard: ^0.5.0
  shadcn_flutter: 0.0.54
  toml: ^0.18.0
  unorm_dart: ^0.3.2
  window_manager: ^0.5.1
  zeta_agent_core: ^0.1.0
  zeta_agent_provider_api: ^0.1.0
  zeta_agent_provider_sdk: ^0.1.0
  zeta_agent_providers: ^0.1.0
  zeta_foundation: ^0.1.0
  zeta_markdown: ^0.1.0
  zeta_plugin_kernel: ^0.1.0
  zeta_ui: ^0.1.0

dev_dependencies:
  # 架构守卫用它做 AST 解析：正则会被注释和字符串骗过去
  # （见 test/src/architecture/widget_test_hygiene_guard_test.dart）。
  analyzer: ^12.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/agents/
  fonts:
    # 界面无衬线体。Geist 不含中日韩字形，中文由平台回退链承接
    # （见 resolvePlatformUiFontFamilyFallback）。
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    # 代码与机器标识符等宽体。
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
