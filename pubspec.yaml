  pasteboard: ^0.5.0
  project_session_client:
    path: packages/project_session_client
  project_session_repository:
    path: packages/project_session_repository
  settings_client:
    path: packages/settings_client
  settings_repository:
    path: packages/settings_repository
  shadcn_flutter: ^0.0.53
  usage_statistics_repository:
    path: packages/usage_statistics_repository
  usage_statistics_storage_client:
    path: packages/usage_statistics_storage_client
  window_manager: ^0.5.1
  workspace_client:
    path: packages/workspace_client
  workspace_repository:
    path: packages/workspace_repository
  zeta_logging:
    path: packages/zeta_logging
  zeta_storage:
    path: packages/zeta_storage

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
