name: zeta
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_treeview:
    path: third_party/flutter_treeview
  logging: ^1.3.0
  mixin_markdown_widget: 0.3.1
  multi_split_view: ^3.6.2
  shared_preferences: ^2.5.5
  system_fonts: ^1.0.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
