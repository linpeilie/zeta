name: zeta
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: ^1.1.0
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_local_notifications: ^22.2.0
  flutter_svg: ^2.3.0
  glob: ^2.1.2
  highlight: ^0.7.0
  logger: ^2.7.0
  macos_window_utils: ^1.9.1
  mixin_markdown_widget: 0.3.1
  multi_split_view: ^3.6.2
  pasteboard: ^0.5.0
  shadcn_flutter: ^0.0.53
  shared_preferences: ^2.5.5
  toml: ^0.18.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/agents/
  fonts:
    # 界面无衬线体。Geist 不含中日韩字形，中文由平台回退链承接
    # （见 resolvePlatformUiFontFamilyFallback）。
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    # 代码与机器标识符等宽体。
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
